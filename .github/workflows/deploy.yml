name: Deploy to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 記事の公開日時を git 履歴(main に入ったコミットの時刻)から取るため全履歴が要る
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 記事タイトル検査(新規記事は20字以内)
        run: node scripts/check-title-length.mjs

      - name: Install Playwright Chromium (for Mermaid rendering)
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::199410355960:role/rikukadev-github-actions
          aws-region: ap-northeast-1

      - name: Sync to S3
        run: aws s3 sync dist/ s3://rikuka-dev-web --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2AEQ8HF5G501G --paths "/*"
