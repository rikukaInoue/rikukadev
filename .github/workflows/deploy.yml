name: Deploy to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::199410355960:role/rikukadev-github-actions
          aws-region: ap-northeast-1

      - name: Sync to S3
        run: aws s3 sync dist/ s3://rikuka-dev-web --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2AEQ8HF5G501G --paths "/*"
