<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-label="5本の線は同じ方向へ進む" font-size="13"><defs><marker id="spiral-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">5本の線は同じ方向へ進む: 人が守るものを、機械が守る形に</text><text x="142" y="72" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">起点: 人が守る</text><text x="618" y="72" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">現在: 機械が守る</text><g><g><path d="M276 104H484" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#spiral-arrow)"></path></g><g><path d="M276 152H484" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#spiral-arrow)"></path></g><g><path d="M276 200H484" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#spiral-arrow)"></path></g><g><path d="M276 248H484" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#spiral-arrow)"></path></g><g><path d="M276 296H484" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#spiral-arrow)"></path></g></g><g><rect x="24" y="86" width="236" height="36" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="142" y="108" text-anchor="middle" fill="var(--cds-text-primary)">規約を人が守る(AR、動的型)</text><text x="380" y="96" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">言語</text><rect x="500" y="86" width="236" height="36" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="618" y="108" text-anchor="middle" fill="var(--cds-text-primary)">構造が機械を縛る(型、生成)</text></g><g><rect x="24" y="134" width="236" height="36" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="142" y="156" text-anchor="middle" fill="var(--cds-text-primary)">スキーマ変更は深夜の祈り</text><text x="380" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">データ</text><rect x="500" y="134" width="236" height="36" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="618" y="156" text-anchor="middle" fill="var(--cds-text-primary)">互換性の窓を設計する</text></g><g><rect x="24" y="182" width="236" height="36" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="142" y="204" text-anchor="middle" fill="var(--cds-text-primary)">境界は文書とレビュー</text><text x="380" y="192" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">アーキテクチャ</text><rect x="500" y="182" width="236" height="36" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="618" y="204" text-anchor="middle" fill="var(--cds-text-primary)">境界はコンパイルと GRANT</text></g><g><rect x="24" y="230" width="236" height="36" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="142" y="252" text-anchor="middle" fill="var(--cds-text-primary)">統制は申請書(CAB)</text><text x="380" y="240" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">組織</text><rect x="500" y="230" width="236" height="36" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="618" y="252" text-anchor="middle" fill="var(--cds-text-primary)">統制はゲート、判断は数値契約</text></g><g><rect x="24" y="278" width="236" height="36" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="142" y="300" text-anchor="middle" fill="var(--cds-text-primary)">契約はドキュメント</text><text x="380" y="288" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">契約記述</text><rect x="500" y="278" width="236" height="36" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="618" y="300" text-anchor="middle" fill="var(--cds-text-primary)">実行される定義から生成</text></g></svg>
