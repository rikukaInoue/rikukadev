<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-label="デプロイ頻度と安定性はトレードオフではない" font-size="13"><defs><marker id="fk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker><marker id="fk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-categorical-1)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">デプロイ頻度と安定性はトレードオフではない(DORA、2018)</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M120 76V292H640" marker-end="url(#fk-arrow)"></path><path d="M120 292V76" marker-end="url(#fk-arrow)"></path></g><text x="380" y="320" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">速度 → デプロイ頻度、変更のリードタイム</text><text x="24" y="184" font-size="11.5" fill="var(--cds-text-secondary)">安定性 ↑</text><text x="24" y="202" font-size="11.5" fill="var(--cds-text-secondary)">変更障害率、復旧時間</text><g><path d="M160 106L600 262" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="6 5"></path><text x="600" y="252" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">CAB の前提: 速いほど壊れる</text></g><g><path d="M160 262L600 106" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2" marker-end="url(#fk-arrow-accent)"></path><text x="420" y="124" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">DORA の発見: 速い組織ほど安定</text></g><g><circle cx="216" cy="222" r="7" fill="var(--cds-chart-axis)"></circle><text x="216" y="208" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">Low: 月に数回、復旧に数日</text></g><g><circle cx="544" cy="146" r="7" fill="var(--cds-chart-categorical-1)"></circle><text x="544" y="172" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">Elite: 日に何度も、復旧は1時間未満</text></g><text x="380" y="286" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">小さい変更は壊れにくく、壊れても戻しやすい</text></svg>
