<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" role="img" aria-label="真実から一方向に生成する" font-size="13"><defs><marker id="gen-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker><marker id="gen-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-status-critical)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">MDA の夢は、起点を図から「実行されている定義」に変えて叶った</text><text x="24" y="70" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">MDA(2001): 図が起点。生成物を手で直した瞬間に往復が壊れる</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M212 104H252" marker-end="url(#gen-arrow)"></path><path d="M428 104H468" marker-end="url(#gen-arrow)"></path></g><path d="M556 130V144H124V130" fill="none" stroke="var(--cds-chart-status-critical)" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#gen-arrow-bad)"></path><text x="340" y="158" text-anchor="middle" font-size="11.5" fill="var(--cds-chart-status-critical)">図に戻さない → 図が古くなる</text><g><rect x="36" y="78" width="176" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="124" y="108" text-anchor="middle" fill="var(--cds-text-primary)">UML の図(人向け)</text></g><g><rect x="252" y="78" width="176" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="340" y="108" text-anchor="middle" fill="var(--cds-text-primary)">コード生成</text></g><g><rect x="468" y="78" width="176" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="556" y="100" text-anchor="middle" fill="var(--cds-text-primary)">コード</text><text x="556" y="118" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">締切の夜に手で直す</text></g><line x1="24" y1="176" x2="736" y2="176" stroke="var(--cds-chart-grid)"></line><text x="24" y="198" font-size="11.5" font-weight="600" fill="var(--cds-text-secondary)">スキーマ駆動(2015-): すでに実行されている定義が起点。生成物は人が触らない</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M212 250H252" marker-end="url(#gen-arrow)"></path><path d="M428 250H468" marker-end="url(#gen-arrow)"></path><path d="M212 322H252" marker-end="url(#gen-arrow)"></path><path d="M428 322H468" marker-end="url(#gen-arrow)"></path></g><g><rect x="36" y="224" width="176" height="52" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="124" y="246" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">schema.sql</text><text x="124" y="264" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">DB が実行する = 真実</text></g><g><rect x="252" y="224" width="176" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="340" y="254" text-anchor="middle" fill="var(--cds-text-primary)">sqlc</text></g><g><rect x="468" y="224" width="176" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="556" y="246" text-anchor="middle" fill="var(--cds-text-primary)">型付きの repository</text><text x="556" y="264" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">SQL と型はズレようがない</text></g><g><rect x="36" y="296" width="176" height="52" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="124" y="318" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">openapi.yaml</text><text x="124" y="336" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ゲートウェイが検証 = 真実</text></g><g><rect x="25