<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" role="img" aria-label="分散の代金だけ払う形と、独立性を得る形" font-size="13"><defs><marker id="dm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker><marker id="dm-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-status-critical)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">分散の代金だけ払う形と、独立性を得る形</text><line x1="380" y1="60" x2="380" y2="280" stroke="var(--cds-chart-grid)"></line><text x="192" y="72" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">分散モノリス</text><text x="192" y="90" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">同期呼び出しの鎖、DB 共有、同時デプロイ</text><text x="564" y="72" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">独立したサービス</text><text x="564" y="90" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">自分の DB、土管を通るイベント、別々に出す</text><g fill="none" stroke="var(--cds-chart-status-critical)" stroke-width="1.25"><path d="M116 172H156" marker-end="url(#dm-arrow-bad)"></path><path d="M228 172H268" marker-end="url(#dm-arrow-bad)"></path></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M80 192V234" marker-end="url(#dm-arrow)"></path><path d="M192 192V234" marker-end="url(#dm-arrow)"></path><path d="M304 192V234" marker-end="url(#dm-arrow)"></path></g><g><rect x="44" y="152" width="72" height="40" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="80" y="176" text-anchor="middle" fill="var(--cds-text-primary)">A</text></g><g><rect x="156" y="152" width="72" height="40" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="192" y="176" text-anchor="middle" fi