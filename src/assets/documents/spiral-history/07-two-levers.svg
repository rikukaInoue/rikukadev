<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" role="img" aria-label="レバーが1本から2本になる" font-size="13"><defs><marker id="lever-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">デプロイとリリースを分けると、レバーが1本から2本になる</text><line x1="380" y1="60" x2="380" y2="292" stroke="var(--cds-chart-grid)"></line><text x="192" y="74" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">リリーストレイン(第2部)</text><text x="192" y="92" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">デプロイ = リリース = 賭け</text><g><rect x="40" y="120" width="304" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="192" y="142" text-anchor="middle" fill="var(--cds-text-primary)">2週間ぶんの変更を全部束ねる</text><text x="192" y="160" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">未完成の機能も「とりあえず乗せる」</text></g><path d="M192 172V212" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" marker-end="url(#lever-arrow)"></path><text x="204" y="196" font-size="11.5" fill="var(--cds-text-secondary)">レバー1本</text><g><rect x="40" y="214" width="304" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="192" y="236" text-anchor="middle" fill="var(--cds-text-primary)">本番: 全部出る、失敗すれば全部戻る</text><text x="192" y="254" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">次の列車は2週間後</text></g><text x="568" y="74" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">プログレッシブデリバリー(第4部)</text><text x="568" y="92" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">コードを出すことと、見せることを分ける</text><g><rect x="416" y="120" width="144" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="488" y="142" text-anchor="middle" fill="var(--cds-text-primary)">デプロイ</text><text x="488" y="160" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">毎日、小さく</text></g><g><rect x="576" y="120" width="144" height="52" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="648" y="142" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">リリース</text><text x="648" y="160" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">フラグで 1% → 100%</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M488 172V212" marker-end="url(#lever-arrow)"></path><path d="M648 172V212" marker-end="url(#lever-arrow)"></path></g><text x="568" y="196" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">レバー2本、別々に引く</text><g><rect x="416" y="214" width="304" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="568" y="236" text-anchor="middle" fill="var(--cds-text-primary)">本番: コードは入っているが、見せるのは少しずつ</text><text x="568" y="254" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">戻すのはフラグだけ。デプロイは戻さない</text></g></svg>
