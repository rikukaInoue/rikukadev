<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-label="1つのクラスに3つの関心が同居する" font-size="13"><defs><marker id="ar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">ActiveRecord: 1つのクラスに3つの関心が同居する</text><g><rect x="24" y="68" width="392" height="248" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="40" y="94" font-weight="600" fill="var(--cds-text-primary)">class Order extends ActiveRecord</text><line x1="40" y1="108" x2="400" y2="108" stroke="var(--cds-chart-grid)"></line><line x1="40" y1="172" x2="400" y2="172" stroke="var(--cds-chart-grid)"></line><line x1="40" y1="236" x2="400" y2="236" stroke="var(--cds-chart-grid)"></line></g><g><text x="40" y="134" fill="var(--cds-text-primary)">rules() / beforeSave</text><text x="40" y="154" font-size="11.5" fill="var(--cds-text-secondary)">注文は在庫を超えられない — ドメインの不変条件</text></g><g><text x="40" y="198" fill="var(--cds-text-primary)">属性 = カラム</text><text x="40" y="218" font-size="11.5" fill="var(--cds-text-secondary)">order_status、NULL の扱い、型変換 — DB の都合</text></g><g><text x="40" y="262" fill="var(--cds-text-primary)">attributeLabels() / getter</text><text x="40" y="282" font-size="11.5" fill="var(--cds-text-secondary)">ラベル、金額のフォーマット — 表示の都合</text></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25" stroke-dasharray="4 4"><path d="M416 140H520" marker-end="url(#ar-arrow)"></path><path d="M416 204H520" marker-end="url(#ar-arrow)"></path><path d="M416 268H520" marker-end="url(#ar-arrow)"></path></g><g><rect x="520" y="118" width="216" height="44" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="628" y="144" text-anchor="middle" fill="var(--cds-text-primary)">ドメインモデル</text></g><g><rect x="520" y="182" width="216" height="44" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="628" y="208" text-anchor="middle" fill="var(--cds-text-primary)">マッピング層(repository)</text></g><g><rect x="520" y="246" width="216" height="44" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="628" y="272" text-anchor="middle" fill="var(--cds-text-primary)">ビューモデル</text></g><text x="628" y="94" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">本来の主(移行で返す先)</text></svg>
