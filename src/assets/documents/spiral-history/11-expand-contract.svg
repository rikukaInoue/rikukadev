<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" role="img" aria-label="互換性の窓を設計する" font-size="13"><defs><marker id="ec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">expand/contract: 1つの変更を、どこで戻しても壊れない手順に分ける</text><text x="24" y="54" font-size="11.5" fill="var(--cds-text-secondary)">例: カラム name を display_name に改名する</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M152 116H170" marker-end="url(#ec-arrow)"></path><path d="M298 116H316" marker-end="url(#ec-arrow)"></path><path d="M444 116H462" marker-end="url(#ec-arrow)"></path><path d="M590 116H608" marker-end="url(#ec-arrow)"></path></g><g><rect x="24" y="80" width="128" height="72" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="88" y="106" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">R1 expand</text><text x="88" y="124" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">新カラムを足す</text><text x="88" y="140" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">INSTANT、数十ms</text></g><g><rect x="170" y="80" width="128" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="234" y="106" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">R2 両方に書く</text><text x="234" y="124" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">新旧どちらを読んでも</text><text x="234" y="140" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">同じ値になる</text></g><g><rect x="316" y="80" width="128" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="106" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">backfill</text><text x="380" y="124" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">既存行の旧→新を</text><text x="380" y="140" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">小さく埋める</text></g><g><rect x="462" y="80" width="128" height="72" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="526" y="106" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">R3 新だけ読む</text><text x="526" y="124" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">旧にはもう</text><text x="526" y="140" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">誰も依存しない</text></g><g><rect x="608" y="80" width="128" height="72" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="672" y="106" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">R4 contract</text><text x="672" y="124" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">旧カラムを消す</text><text x="672" y="140" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ここだけ不可逆</text></g><g><rect x="24" y="176" width="566" height="40" rx="8" fill="var(--cds-chart-status-good)" fill-opacity="0.12" stroke="var(--cds-chart-status-good)" stroke-width="1.25"></rect><text x="307" y="201" text-anchor="middle" fill="var(--cds-text-primary)">互換性の窓: どの時点で 1 つ前に戻しても、新旧のバイナリが同じ DB で動く</text></g><text x="307" y="242" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">手順は面倒に見えるが、「深夜のメンテナンス」と「戻せないデプロイ」の両方が消える</text><text x="672" y="201" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">R3 が安定してから</text></svg>
