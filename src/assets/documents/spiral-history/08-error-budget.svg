<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="エラーバジェットは口論を数値契約に変える" font-size="13"><defs><marker id="eb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">エラーバジェット: 「速度か信頼性か」の口論を1回の契約に変える</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M175 120H205" marker-end="url(#eb-arrow)"></path><path d="M355 120H384" marker-end="url(#eb-arrow)"></path><path d="M460 164V214" marker-end="url(#eb-arrow)"></path><path d="M536 120H650V214" marker-end="url(#eb-arrow)"></path><path d="M385 240H355" marker-end="url(#eb-arrow)"></path><path d="M650 266V284H280V266" marker-end="url(#eb-arrow)"></path><path d="M280 214V146" marker-end="url(#eb-arrow)"></path></g><g><rect x="25" y="94" width="150" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="100" y="116" text-anchor="middle" fill="var(--cds-text-primary)">SLO を決める</text><text x="100" y="134" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">例: 月の可用性 99.9%</text></g><g><rect x="205" y="94" width="150" height="52" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="280" y="116" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">予算 = 許される障害</text><text x="280" y="134" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">99.9% なら月に約43分</text></g><g><polygon points="384,120 460,76 536,120 460,164" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></polygon><text x="460" y="124" text-anchor="middle" fill="var(--cds-text-primary)">予算は残っているか</text></g><g><rect x="385" y="214" width="150" height="52" rx="8" fill="var(--cds-chart-status-good)" fill-opacity="0.12" stroke="var(--cds-chart-status-good)" stroke-width="2"></rect><text x="460" y="236" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">リリースする</text><text x="460" y="254" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">会議は要らない</text></g><g><rect x="575" y="214" width="150" height="52" rx="8" fill="var(--cds-chart-status-warning)" fill-opacity="0.12" stroke="var(--cds-chart-status-warning)" stroke-width="2"></rect><text x="650" y="236" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">信頼性に投資する</text><text x="650" y="254" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">新機能を止めて直す</text></g><g><rect x="205" y="214" width="150" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="280" y="236" text-anchor="middle" fill="var(--cds-text-primary)">SLI を計測する</text><text x="280" y="254" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">使った分を予算から引く</text></g><text x="450" y="192" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">残っている</text><text x="548" y="112" font-size="11.5" fill="var(--cds-text-secondary)">尽きた</text></svg>
