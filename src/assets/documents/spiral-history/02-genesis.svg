<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="三面が同じ真理を見つけた" font-size="13"><defs><marker id="genesis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">1968-1972、三面が同じ真理を別々に見つけた</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M134 162V212H180V236" marker-end="url(#genesis-arrow)"></path><path d="M380 162V236" marker-end="url(#genesis-arrow)"></path><path d="M626 162V212H580V236" marker-end="url(#genesis-arrow)"></path></g><g><rect x="24" y="66" width="220" height="96" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="134" y="90" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">組織 — Conway 1968</text><text x="134" y="116" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">隠す: チーム内の会話</text><text x="134" y="136" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">契約: チーム間のインターフェース</text></g><g><rect x="270" y="66" width="220" height="96" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="90" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">データ — Codd 1970</text><text x="380" y="116" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">隠す: 物理的な格納と経路</text><text x="380" y="136" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">契約: 宣言的な問い(SQL)</text></g><g><rect x="516" y="66" width="220" height="96" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="626" y="90" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">コード — Parnas 1972</text><text x="626" y="116" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">隠す: 変わりそうな設計判断</text><text x="626" y="136" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">契約: モジュールのインターフェース</text></g><g><rect x="60" y="236" width="640" height="72" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="380" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="var(--cds-text-primary)">構造が変更コストを決める</text><text x="380" y="290" text-anchor="middle" fill="var(--cds-text-primary)">守るべきものは、破る操作が存在しない形にする</text></g></svg>
