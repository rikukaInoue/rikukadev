<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="変更は申請書と会議で統制する" font-size="13"><defs><marker id="cab-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">変更は申請書と会議で統制する(CAB、1989)</text><text x="24" y="54" font-size="11.5" fill="var(--cds-text-secondary)">1周が1〜2週間。変更を減らすほど安全、という前提の上に立つ</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M179 112H211" marker-end="url(#cab-arrow)"></path><path d="M361 112H386" marker-end="url(#cab-arrow)"></path><path d="M530 112H571" marker-end="url(#cab-arrow)"></path><path d="M458 156V206" marker-end="url(#cab-arrow)"></path><path d="M383 232H104V138" marker-end="url(#cab-arrow)"></path></g><g><rect x="29" y="86" width="150" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="104" y="108" text-anchor="middle" fill="var(--cds-text-primary)">変更要求(RFC)</text><text x="104" y="126" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">を起票する</text></g><g><rect x="211" y="86" width="150" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="286" y="108" text-anchor="middle" fill="var(--cds-text-primary)">影響範囲と</text><text x="286" y="126" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">切り戻し手順を書く</text></g><g><polygon points="386,112 458,68 530,112 458,156" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></polygon><text x="458" y="110" text-anchor="middle" fill="var(--cds-text-primary)">週次の CAB</text><text x="458" y="128" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">承認するか</text></g><g><rect x="571" y="86" width="150" height="52" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="646" y="108" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">メンテウィンドウで</text><text x="646" y="126" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">適用する</text></g><g><rect x="383" y="206" width="150" height="52" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="458" y="236" text-anchor="middle" fill="var(--cds-text-primary)">差し戻し</text></g><text x="550" y="102" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">承認</text><text x="468" y="188" font-size="11.5" fill="var(--cds-text-secondary)">否認</text><text x="243.5" y="224" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">書き直して次週の会議へ</text></svg>
